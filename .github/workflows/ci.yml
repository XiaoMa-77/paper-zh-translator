name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装中文字体（打印 PDF 需要可分发的 CJK 字体）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 安装依赖
        run: pip install -e '.[dev]'

      - name: Lint（ruff）
        run: ruff check src tests tools

      - name: 结构级测试
        run: python tests/smoke.py

      - name: 端到端（自制样本，--provider none）
        run: PAPERTRANS_SAMPLE=samples/toy-paper.pdf python tests/smoke.py
        env:
          PAPERTRANS_BROWSER: /usr/bin/google-chrome
