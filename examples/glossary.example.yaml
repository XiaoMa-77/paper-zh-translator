# - 键：原文中的英文术语（区分大小写），会注入系统提示约束译法；
# - 值：固定中文译法，全篇统一；
# - 命中情况会统计进 report 的 glossary_hit（如 4/5 表示 5 条术语有 4 条出现在译文里）。
# - 没把握的术语可以不译，写回英文本身：some-term: some-term

