[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrans"
version = "0.1.0"
description = "PDF 论文中文翻译：保持双栏版式、公式与表格"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pyyaml>=6.0",
]

[project.scripts]
papertrans = "papertrans.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
